plugins {
    id 'com.android.application'
}

android {
    namespace 'name.bagi.levente.pedometer'
    compileSdk 34

    defaultConfig {
        applicationId 'name.bagi.levente.pedometer'
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName '1.5.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
